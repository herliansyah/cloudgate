<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="460" height="110">
  <defs>
    <linearGradient id="cg-cloud-grad" x1="15%" y1="90%" x2="85%" y2="10%">
      <stop offset="0%" stop-color="#2D4BFF"/>
      <stop offset="50%" stop-color="#3859FF"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <linearGradient id="cg-beam-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="cg-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3859FF"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <linearGradient id="cg-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3859FF" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="cg-shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2548EE" flood-opacity="0.35"/>
    </filter>
    <style>
      .brand-title-main {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #1A1F2C;
      }
      .brand-title-gate {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 500;
        font-size: 42px;
        fill: url(#cg-text-grad);
      }
      .brand-tagline {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 600;
        font-size: 10.5px;
        letter-spacing: 2.5px;
        fill: #5A6679;
      }
      @media (prefers-color-scheme: dark) {
        .brand-title-main { fill: #F0F4FC; }
        .brand-tagline { fill: #9AA8BC; }
      }
    </style>
  </defs>

  <!-- Left Symbol (scaled 0.72 inside 110px canvas) -->
  <g transform="translate(8, 7) scale(0.75)">
    <path d="M 49 96 L 26 96 C 18 96 12 89.5 12 81.5 C 12 74.2 16.8 68.2 23.8 66.8 C 23.3 64.7 23 62.6 23 60.5 C 23 46 34.5 34 49 34 C 54.6 34 59.8 35.8 64 38.8 C 68.8 30.5 77.8 25 88 25 C 103.5 25 116 37.5 116 53 C 116 55.2 115.7 57.3 115.2 59.3 C 121.5 62.5 126 69 126 76.5 C 126 87.3 117.2 96 106.5 96 L 79 96 L 79 73 C 79 64.7 72.3 58 64 58 C 55.7 58 49 64.7 49 73 Z"
          fill="url(#cg-cloud-grad)"
          filter="url(#cg-shadow)"/>
    <path d="M 49 96 L 26 96 C 18 96 12 89.5 12 81.5 C 12 74.2 16.8 68.2 23.8 66.8 C 23.3 64.7 23 62.6 23 60.5 C 23 46 34.5 34 49 34 C 54.6 34 59.8 35.8 64 38.8 C 68.8 30.5 77.8 25 88 25 C 103.5 25 116 37.5 116 53 C 116 55.2 115.7 57.3 115.2 59.3 C 121.5 62.5 126 69 126 76.5 C 126 87.3 117.2 96 106.5 96 L 79 96"
          fill="none"
          stroke="url(#cg-glow-grad)"
          stroke-width="1.5"
          stroke-linecap="round"/>
    <rect x="61.5" y="75" width="5" height="19" rx="2.5" fill="url(#cg-beam-grad)"/>
    <path d="M 58 71 L 64 65 L 70 71"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <circle cx="64" cy="65" r="1.5" fill="#00D2FF"/>
  </g>

  <!-- Typographic Wordmark -->
  <text x="116" y="60">
    <tspan class="brand-title-main">Cloud</tspan><tspan class="brand-title-gate">gate</tspan>
  </text>
  <text x="118" y="82" class="brand-tagline">UNIFIED STORAGE GATEWAY</text>
</svg>